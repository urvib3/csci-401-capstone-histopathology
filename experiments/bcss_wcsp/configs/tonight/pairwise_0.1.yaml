name: tonight_pairwise_0.1
dataset:
  name: bcss
  root: $WCSP_DATA/bcss
  split: dev
classifier:
  name: tia_unet_trained
  checkpoint: data/outputs/tonight/pairwise_0.1/best.pt
  temperature: 1.0
  cache_tag: tonight_pairwise_0.1
  weights: data/tiatoolbox/models/fcn_resnet50_unet-bcss.pth
problem:
  alpha: 1.0
  lam: 8.0
  eta: 1.0
  types:
  - 1
  - 2
  - 3
  - 4
  - 5
  normalize: true
  table: handwritten
  contrast_beta: 0.0
  contrast_sigma: 0.1
  color_space: rgb
solver:
  name: blocks
  block: 100
  max_rounds: 4
  inner:
    name: icm
paths:
  cache: $WCSP_OUT/cache
  runs: $WCSP_OUT/runs
